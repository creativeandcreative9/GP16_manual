<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ボーン工房 使用手引書</title>
<style>
:root{--bg:#fbfaf7;--fg:#22252a;--muted:#5d6570;--line:#dcd8cf;--panel:#f2efe8;--accent:#0b6b5d;--accent-fg:#fff;--done:#8a929c}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--fg:#e8e6e1;--muted:#a3abb4;--line:#33373d;--panel:#202327;--accent:#5fc9b7;--accent-fg:#0d1512;--done:#78808a}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Yu Gothic UI","Hiragino Sans","Meiryo",system-ui,sans-serif;font-size:17px;line-height:1.85}
.layout{display:flex;align-items:flex-start;max-width:1180px;margin:0 auto}
nav.toc{position:sticky;top:0;align-self:flex-start;width:290px;flex:none;height:100vh;overflow-y:auto;padding:20px 16px 40px;border-right:1px solid var(--line);font-size:14.5px;line-height:1.5}
nav.toc h2{font-size:15px;margin:0 0 4px;border:0;padding:0}
nav.toc a{display:block;padding:5px 8px;border-radius:6px;color:var(--fg);text-decoration:none}
nav.toc a:hover{background:var(--panel)}
nav.toc a.on{background:var(--accent);color:var(--accent-fg)}
nav.toc .grp{margin:14px 0 2px 8px;font-size:12.5px;color:var(--muted);letter-spacing:.04em}
main{flex:1;min-width:0;padding:8px 28px 120px;max-width:820px}
section.chapter{padding:34px 0 18px;border-bottom:1px solid var(--line);scroll-margin-top:0}
h1{font-size:30px;line-height:1.35;margin:.2em 0 .5em}
h2{font-size:22px;margin:1.9em 0 .4em;padding-left:12px;border-left:5px solid var(--accent);line-height:1.4}
h3{font-size:18px;margin:1.5em 0 .3em}
p{margin:.7em 0}
a{color:var(--accent)}
code{background:var(--panel);padding:.1em .4em;border-radius:5px;font-size:.92em}
img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block;margin:12px 0;cursor:zoom-in;background:var(--panel)}
ol,ul{padding-left:1.5em}
li{margin:.5em 0}
ol.steps{counter-reset:step;padding-left:0;list-style:none}
ol.steps>li.step{position:relative;padding:10px 12px 10px 3em;border:1px solid var(--line);border-radius:10px;background:var(--panel);counter-increment:step}
ol.steps>li.step::before{content:counter(step);position:absolute;left:10px;top:12px;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:700;text-align:center;line-height:1.7em;font-size:.95em}
li.step.done{opacity:.6}
li.step.done::before{content:"✓";background:var(--done)}
li.step .tick{float:right;margin:0 0 4px 8px;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:0 10px;line-height:1.8;cursor:pointer}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:15px;line-height:1.6;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--panel)}
.top{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:5}
.top button,.top a{background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer;box-shadow:0 2px 8px #0003}
.menu-btn{display:none}
#lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:94vh;border:0;margin:0;cursor:zoom-out}
#lightbox.on{display:flex}
@media (max-width:860px){
  nav.toc{position:fixed;left:0;top:0;z-index:10;background:var(--bg);transform:translateX(-100%);transition:transform .2s;width:min(86vw,320px);box-shadow:0 0 20px #0005}
  nav.toc.open{transform:none}
  .menu-btn{display:inline-block}
  main{padding:8px 16px 120px}
  body{font-size:16.5px}
}
@media print{nav.toc,.top{display:none}.layout{display:block}section.chapter{break-before:page}img{cursor:auto}li.step .tick{display:none}}
.zukan-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 16px 10px;margin:18px 0}
.zukan-card>h2{margin-top:.7em}
.zukan-card>h3{margin-top:.7em}
.zukan-card img{background:var(--bg)}
.zukan-card table{background:var(--bg)}
.zukan-hero{border:2px solid var(--accent)}
.zukan-where{font-size:15px;border-top:1px dashed var(--line);padding-top:8px}
.zukan-limit{font-size:15px;color:var(--muted)}
.zukan-mark{display:inline-block;font-size:12.5px;line-height:1.8;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--muted);margin:2px 0 4px;background:var(--bg)}
.zukan-mini{padding:0 14px 4px}
.zukan-mini>h3{font-size:16.5px}
.zukan-card td:first-child{white-space:nowrap}
</style>
</head>
<body>
<div class="layout">
<nav class="toc" aria-label="目次"><h2>ボーン工房 使用手引書</h2><div class="grp">はじめに</div><a href="#ch-index">ボーン工房 使用手引書</a></nav>
<main>
<section class="chapter" id="ch-index"><h1>ボーン工房 使用手引書</h1>
<ul>
<li>版: 2.0（作成中）</li>
<li>日付: 2026-11-02</li>
</ul>
<p>この手引書は、いま作っています。
画面の新しい版（2.0）に合わせて、はじめから書き直しています。
できた章から、順に載せていきます。</p>
<p>ボーン工房は、Unity の中で、物や服にボーンを入れる道具です。
物の上に線を 1 本引くと、ボーンが入ります。
服のリボンや、箱の蓋を動かせるようになります。</p>
</section>
</main>
</div>
<script>
(function(){
  /* 手順の「できた」印は、読む人のブラウザにだけ残る。KEY は作品ごとに変える */
  var KEY='GP16-manual-done', done={};
  try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
  document.querySelectorAll('section.chapter ol').forEach(function(ol){
    var items=[].filter.call(ol.children,function(c){return c.tagName==='LI'});
    if(!items.length||ol.closest('li'))return;
    ol.classList.add('steps');
    /* CSS の番号は counter で付けるので、<ol start> の続き番号はここで渡す（渡さないと、どの ol も 1 から表示される） */
    if(ol.start>1)ol.style.counterReset='step '+(ol.start-1);
    var sec=ol.closest('section');
    items.forEach(function(li,i){
      var id=(sec?sec.id:'')+':'+i+':'+li.textContent.trim().slice(0,24);
      li.classList.add('step');
      var b=document.createElement('button');b.type='button';b.className='tick';
      function paint(){li.classList.toggle('done',!!done[id]);b.textContent=done[id]?'戻す':'できた'}
      b.onclick=function(){if(done[id])delete done[id];else done[id]=1;save();paint()};
      li.insertBefore(b,li.firstChild);paint();
    });
  });
  var lb=document.getElementById('lightbox'),lbi=lb.querySelector('img');
  document.querySelectorAll('main img').forEach(function(im){im.onclick=function(){lbi.src=im.src;lb.classList.add('on')}});
  lb.onclick=function(){lb.classList.remove('on')};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')lb.classList.remove('on')});
  var toc=document.querySelector('nav.toc');
  document.querySelector('.menu-btn').onclick=function(){toc.classList.toggle('open')};
  toc.addEventListener('click',function(e){if(e.target.tagName==='A')toc.classList.remove('open')});
  var links=[].slice.call(toc.querySelectorAll('a[href^="#"]'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1))});
  function spy(){var y=window.scrollY+120,cur=0;secs.forEach(function(s,i){if(s&&s.offsetTop<=y)cur=i});links.forEach(function(a,i){a.classList.toggle('on',i===cur)})}
  window.addEventListener('scroll',spy,{passive:true});spy();
})();
</script>
</body>
</html>
